<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>R7 SERVIÇOS CONTÁBEIS E ADMINISTRATIVOS | SOLICITAÇÕES</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --primary:#8a6a1f; --primary-dark:#5c4713; --secondary:#c9a227; --on-primary:#ffffff;
  --brand-grey:#4d4d4d; --brand-grey-dark:#2e2e2e;
  --surface:#ffffff; --surface-container-low:#f5f3ee; --surface-container:#efece4;
  --surface-container-high:#e7e2d6; --outline:#79746a; --outline-variant:#d3cdbd;
  --on-surface:#242220; --on-surface-variant:#524d43; --error:#ba1a1a; --on-error:#ffffff;
  --error-container:#ffdad6; --on-error-container:#93000a; --success:#0f7b3c; --success-bg:#e3f6ea;
}
*{ box-sizing:border-box; margin:0; padding:0; text-transform: uppercase; }
body{
  background-color:var(--surface-container-low);
  font-family:'Libre Franklin', 'Segoe UI', Arial, sans-serif;
  color:var(--on-surface); font-size:13px; padding-bottom:40px;
}
button, input, select, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
label{ display:block; margin-bottom:3px; font-size:11px; font-weight:700; color:var(--on-surface-variant); }

.app-header{
  position:sticky; top:0; z-index:50; height:44px; padding:0 14px;
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(180deg, var(--brand-grey) 0%, var(--brand-grey-dark) 100%);
  border-bottom:2px solid var(--secondary); box-shadow: inset 0 1px 0 rgba(255,255,255,0.15); color:#fff;
}
.app-header .brand{ display:flex; align-items:center; gap:9px; font-weight:700; font-size:13px; }
.app-header .brand img{ height:30px; width:auto; }
.app-header .brand span{ color:var(--secondary); letter-spacing:.2px; }

.tabs-bar{
  position:sticky; top:44px; z-index:49; display:flex; gap:2px; background:var(--surface-container-high);
  border-bottom:1px solid var(--outline-variant); padding:0 14px; overflow-x:auto;
}
.tab-btn{
  height:40px; padding:0 18px; border:none; background:transparent; cursor:pointer;
  font-size:12px; font-weight:700; color:var(--on-surface-variant); white-space:nowrap;
  border-bottom:3px solid transparent;
}
.tab-btn.ativo{ color:var(--primary); border-bottom-color:var(--primary); background:var(--surface); }

.main-container{ width:850px; max-width:100%; margin:0 auto; padding:15px; }

.group-box{
  background:var(--surface); border:1px solid var(--outline-variant); border-radius:5px;
  margin-top:16px; box-shadow:0 1px 2px rgba(0,0,0,0.05); overflow:hidden;
}
.group-box-bar{
  height:32px; padding:0 14px; display:flex; align-items:center;
  background:linear-gradient(180deg, var(--secondary) 0%, var(--primary) 100%); color:#fff;
  font-size:12px; font-weight:700;
}
.group-box-body{ padding:15px; }

.grid{ display:grid; gap:12px 15px; grid-template-columns:repeat(12, 1fr); }
.c-2{ grid-column:span 2; } .c-3{ grid-column:span 3; } .c-4{ grid-column:span 4; } .c-5{ grid-column:span 5; } .c-6{ grid-column:span 6; } .c-7{ grid-column:span 7; } .c-10{ grid-column:span 10; } .c-12{ grid-column:span 12; }
.stack{ display:flex; flex-direction:column; gap:2px; }

.input-standard{
  height:34px; border:1px solid var(--outline-variant); padding:0 10px;
  border-radius:4px; width:100%; background:#fff;
}
.input-standard:focus{ outline:none; border-color:var(--primary); box-shadow:0 0 0 2px rgba(138,106,31,0.2); }
textarea.input-standard{ height:auto; min-height:70px; padding:8px 10px; resize:vertical; }

.horario-tabela { width: 100%; border-collapse: collapse; margin-top: 5px; }
.horario-tabela th, .horario-tabela td { border: 1px solid var(--outline-variant); padding: 6px; text-align: center; }
.horario-tabela th { background: var(--surface-container); font-size: 10px; }

.checklist { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.check-item { display: flex; align-items: center; gap: 8px; font-size: 11px; padding: 6px; border: 1px solid var(--outline-variant); border-radius: 4px; cursor: pointer; }
.check-item input { width: 16px; height: 16px; accent-color: var(--primary); }

.radio-row{ display:flex; align-items:center; gap:20px; margin-top:5px; }
.radio-item{ display:flex; align-items:center; gap:6px; font-size:12px; cursor:pointer; }

.action-bar{
  margin-top:20px; padding-top:15px; border-top:1px solid var(--outline-variant);
  display:flex; justify-content:space-between;
}
.btn{
  height:38px; padding:0 20px; border-radius:4px; font-size:12px; font-weight:700;
  cursor:pointer; border:1px solid var(--outline-variant); background:#f5f5f5; color:var(--primary);
}
.btn-primary{ background:var(--primary); color:#fff; border-color:var(--primary-dark); }

.status-bar{
  position:fixed; bottom:0; left:0; width:100%; height:26px;
  background:var(--surface-container-high); border-top:1px solid var(--outline-variant);
  display:flex; align-items:center; justify-content:space-between; padding:0 14px; font-size:10px;
}

.modal-fundo{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:100; align-items:center; justify-content:center; }
.modal-frame{ background:#fff; width:600px; max-width:95%; max-height:90vh; border-radius:6px; display:flex; flex-direction:column; overflow:hidden; }
.modal-body{ padding:15px; overflow-y:auto; }
#saida-texto{ width:100%; min-height:300px; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding:15px; border:1px solid var(--outline-variant); text-transform: none; line-height: 1.5; white-space: pre-wrap; }

.oculto{ display:none !important; }

@media (max-width:768px){
  .grid > div { grid-column: span 12; }
  .checklist { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
       <span>R7 SERVIÇOS CONTÁBEIS E ADMINISTRATIVOS</span>
  </div>
</header>

<nav class="tabs-bar">
  <button class="tab-btn ativo" data-tab="admissao">ADMISSÃO</button>
  <button class="tab-btn" data-tab="desligamento">DESLIGAMENTO</button>
  <button class="tab-btn" data-tab="ferias">FÉRIAS</button>
  <button class="tab-btn" data-tab="outros">OUTROS</button>
</nav>

<div class="main-container">
  <section class="group-box">
    <div class="group-box-bar">IDENTIFICAÇÃO DA EMPRESA E FUNCIONÁRIO</div>
    <div class="group-box-body">
      <div class="grid">
        <div class="c-4 stack"><label>CNPJ</label><input type="text" class="input-standard mask-cnpj" id="cnpj"></div>
        <div class="c-4 stack"><label>RAZÃO SOCIAL</label><input type="text" class="input-standard" id="razao"></div>
        <div class="c-4 stack"><label>UNIDADE</label><input type="text" class="input-standard" id="unidade"></div>
        <div class="c-10 stack"><label>NOME DO FUNCIONÁRIO</label><input type="text" class="input-standard" id="nome"></div>
        <div class="c-2 stack"><label>MATRÍCULA</label><input type="text" class="input-standard" id="matricula" style="font-size: 11px;"></div>
        <div class="c-4 stack"><label>CPF (OPCIONAL)</label><input type="text" class="input-standard mask-cpf" id="cpf"></div>
        <div class="c-8 stack"><label>DATA DE ADMISSÃO</label><input type="date" class="input-standard" id="data-adm"></div>
      </div>
    </div>
  </section>

  <div class="tab-panel" data-panel="admissao">
    <section class="group-box">
      <div class="group-box-bar">DETALHES DA ADMISSÃO</div>
      <div class="group-box-body">
        <div class="grid">
          <div class="c-6 stack"><label>CARGO</label><input type="text" class="input-standard" id="adm-cargo"></div>
          <div class="c-6 stack"><label>PRAZO EXPERIÊNCIA (DIAS)</label><input type="number" class="input-standard" id="adm-prazo"></div>
          <div class="c-12">
            <label>HORÁRIO DE TRABALHO</label>
            <table class="horario-tabela">
              <thead><tr><th>PERÍODO</th><th>ENTRADA</th><th>SAÍDA</th><th>INTERVALO (min)</th></tr></thead>
              <tbody>
                <tr class="h-row" data-dia="SEG A SEX"><td>SEG A SEX</td><td><input type="time" class="input-standard h-ent"></td><td><input type="time" class="input-standard h-sai"></td><td><input type="text" class="input-standard h-int"></td></tr>
                <tr class="h-row" data-dia="SÁBADO"><td>SÁBADO</td><td><input type="time" class="input-standard h-ent"></td><td><input type="time" class="input-standard h-sai"></td><td><input type="text" class="input-standard h-int"></td></tr>
              </tbody>
            </table>
          </div>
          <div class="c-12">
            <label>RELAÇÃO DE DOCUMENTOS ENTREGUES</label>
            <div class="checklist" id="adm-docs">
              <label class="check-item"><input type="checkbox" value="RG/CPF OU CNH"> RG/CPF OU CNH</label>
              <label class="check-item"><input type="checkbox" value="CARTEIRA DE TRABALHO"> CARTEIRA DE TRABALHO</label>
              <label class="check-item"><input type="checkbox" value="COMPR. RESIDÊNCIA"> COMPR. RESIDÊNCIA</label>
              <label class="check-item"><input type="checkbox" value="CERT. NASC/CASAMENTO"> CERT. NASC/CASAMENTO</label>
              <label class="check-item"><input type="checkbox" value="TÍTULO ELEITOR"> TÍTULO ELEITOR</label>
              <label class="check-item"><input type="checkbox" value="CERT. RESERVISTA"> CERT. RESERVISTA</label>
              <label class="check-item"><input type="checkbox" value="DOCS DEPENDENTES"> DOCS DEPENDENTES</label>
              <label class="check-item"><input type="checkbox" value="EXAME ADMISSIONAL"> EXAME ADMISSIONAL</label>
            </div>
          </div>
          <div class="c-12 stack"><label>OBSERVAÇÕES</label><textarea class="input-standard" id="adm-obs"></textarea></div>
        </div>
      </div>
    </section>
  </div>

  <div class="tab-panel oculto" data-panel="desligamento">
    <section class="group-box">
      <div class="group-box-bar">DETALHES DO DESLIGAMENTO</div>
      <div class="group-box-body">
        <div class="grid">
          <div class="c-6 stack"><label>DATA DO AVISO</label><input type="date" class="input-standard" id="des-data-aviso"></div>
          <div class="c-6 stack"><label>ÚLTIMO DIA TRABALHADO</label><input type="date" class="input-standard" id="des-ultimo-dia"></div>
          <div class="c-12 stack">
            <label>QUEM TOMOU A DECISÃO?</label>
            <select class="input-standard" id="des-motivo">
              <option value="O FUNCIONÁRIO PEDIU PARA SAIR">O FUNCIONÁRIO PEDIU PARA SAIR</option>
              <option value="A EMPRESA DECIDIU DISPENSAR O FUNCIONÁRIO">A EMPRESA DISPENSOU O FUNCIONÁRIO</option>
              <option value="A EMPRESA DISPENSOU POR JUSTA CAUSA (FALTA GRAVE)">A EMPRESA DISPENSOU POR JUSTA CAUSA (FALTA GRAVE)</option>
              <option value="FOI UM ACORDO ENTRE A EMPRESA E O FUNCIONÁRIO">FOI UM ACORDO ENTRE A EMPRESA E O FUNCIONÁRIO</option>
              <option value="TERMINOU O PERÍODO DE EXPERIÊNCIA">TERMINOU O PERÍODO DE EXPERIÊNCIA</option>
              <option value="OUTRO MOTIVO (EXPLIQUE NAS OBSERVAÇÕES)">OUTRO MOTIVO (EXPLIQUE NAS OBSERVAÇÕES)</option>
            </select>
          </div>
          <div class="c-12 stack"><label>APONTAMENTOS (FALTAS, ATRASOS, VARIÁVEIS)</label><textarea class="input-standard" id="des-apontamentos"></textarea></div>
          <div class="c-12 stack"><label>OBSERVAÇÕES</label><textarea class="input-standard" id="des-obs"></textarea></div>
        </div>
      </div>
    </section>
  </div>

  <div class="tab-panel oculto" data-panel="ferias">
    <section class="group-box">
      <div class="group-box-bar">SOLICITAÇÃO DE FÉRIAS</div>
      <div class="group-box-body">
        <div class="grid">
          <div class="c-6 stack"><label>DATA DE INÍCIO</label><input type="date" class="input-standard" id="fer-inicio"></div>
          <div class="c-6 stack"><label>QUANTIDADE DE DIAS</label><input type="number" class="input-standard" id="fer-dias" value="30"></div>
          <div class="c-6 stack"><label>DATA DE RETORNO (CÁLCULO AUTOMÁTICO)</label><input type="text" class="input-standard" id="fer-retorno" readonly></div>
          <div class="c-6 stack">
            <label>ABONO PECUNIÁRIO (VENDER 10 DIAS)?</label>
            <div class="radio-row">
              <label class="radio-item"><input type="radio" name="fer-abono" value="SIM"> SIM</label>
              <label class="radio-item"><input type="radio" name="fer-abono" value="NÃO" checked> NÃO</label>
            </div>
          </div>
          <div class="c-12 stack"><label>OBSERVAÇÕES</label><textarea class="input-standard" id="fer-obs"></textarea></div>
        </div>
      </div>
    </section>
  </div>

  <div class="tab-panel oculto" data-panel="outros">
    <section class="group-box">
      <div class="group-box-bar">OUTROS ASSUNTOS</div>
      <div class="group-box-body">
        <textarea class="input-standard" id="outros-texto" style="min-height:200px;" placeholder="DESCREVA AQUI SUA SOLICITAÇÃO DETALHADAMENTE..."></textarea>
      </div>
    </section>
  </div>

  <div class="action-bar">
    <button type="button" class="btn" id="btn-limpar">LIMPAR TUDO</button>
    <button type="button" class="btn btn-primary" id="btn-enviar">GERAR RESUMO DA SOLICITAÇÃO</button>
  </div>
</div>

<footer class="status-bar">
  <div>R7 SERVIÇOS CONTÁBEIS</div>
  <div id="stbar-data">--/--/----</div>
</footer>

<div class="modal-fundo" id="modal-resumo">
  <div class="modal-frame">
    <div class="barra"><span>RESUMO DA SOLICITAÇÃO</span></div>
    <div class="modal-body">
      <textarea id="saida-texto" readonly></textarea>
      <div style="margin-top:15px; display:flex; gap:10px;">
        <button type="button" class="btn btn-primary" id="btn-copiar">COPIAR TEXTO</button>
        <button type="button" class="btn" id="btn-fechar">FECHAR</button>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
document.getElementById("stbar-data").textContent = new Date().toLocaleDateString('pt-BR');

// MÁSCARAS
function mask(id, fn) {
  const el = document.getElementById(id);
  el.addEventListener("input", (e) => { e.target.value = fn(e.target.value); });
}
mask("cnpj", v => v.replace(/\D/g,"").slice(0,14).replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2})/, "$1.$2.$3/$4-$5"));
mask("cpf", v => v.replace(/\D/g,"").slice(0,11).replace(/^(\d{3})(\d{3})(\d{3})(\d{0,2})/, "$1.$2.$3-$4"));

// NAVEGAÇÃO
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("ativo"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.add("oculto"));
    btn.classList.add("ativo");
    document.querySelector(`[data-panel="${btn.dataset.tab}"]`).classList.remove("oculto");
  });
});

// CÁLCULO DE FÉRIAS
function calcFerias() {
  const ini = document.getElementById("fer-inicio").value;
  const dias = parseInt(document.getElementById("fer-dias").value) || 0;
  if(ini && dias) {
    const d = new Date(ini + "T00:00:00");
    d.setDate(d.getDate() + dias);
    document.getElementById("fer-retorno").value = d.toLocaleDateString('pt-BR');
  }
}
document.getElementById("fer-inicio").addEventListener("change", calcFerias);
document.getElementById("fer-dias").addEventListener("input", calcFerias);

// GERAR RESUMO PARA EMAIL
document.getElementById("btn-enviar").addEventListener("click", () => {
  const getV = id => document.getElementById(id).value.toUpperCase();
  const getD = id => { const v = document.getElementById(id).value; if(!v) return ""; const [a,m,d] = v.split("-"); return `${d}/${m}/${a}`; };
  
  // Helper para adicionar linha apenas se houver valor
  const addLinha = (label, val) => val && val.trim() !== '' ? `${label}: ${val}\n` : '';
  
  let txt = `SOLICITAÇÃO DE DEPARTAMENTO PESSOAL - R7 SERVIÇOS CONTÁBEIS\n\n`;
  
  txt += `IDENTIFICAÇÃO\n`;
  txt += addLinha('Empresa', getV('razao'));
  txt += addLinha('CNPJ', getV('cnpj'));
  txt += addLinha('Unidade', getV('unidade'));
  
  const nome = getV('nome');
  const mat = getV('matricula');
  if(nome || mat) {
    txt += `Funcionário: ${nome}${mat ? ' (Matrícula: ' + mat + ')' : ''}\n`;
  }
  
  txt += addLinha('CPF', getV('cpf'));
  txt += addLinha('Data de Admissão', getD('data-adm'));
  txt += '\n';
  
  const aba = document.querySelector(".tab-btn.ativo").dataset.tab;
  
  if(aba === "admissao") {
    txt += `DETALHES DA ADMISSÃO\n`;
    txt += addLinha('Cargo', getV('adm-cargo'));
    txt += addLinha('Prazo de Experiência', getV('adm-prazo') ? getV('adm-prazo') + ' dias' : '');
    
    let temHorario = false;
    let horariosTxt = '';
    document.querySelectorAll(".h-row").forEach(row => {
      const dia = row.dataset.dia;
      const ent = row.querySelector(".h-ent").value;
      const sai = row.querySelector(".h-sai").value;
      let int = row.querySelector(".h-int").value;
      if(ent || sai) {
        temHorario = true;
        int = int ? int + ' min' : 'Sem intervalo';
        horariosTxt += `- ${dia}: ${ent} às ${sai} (${int})\n`;
      }
    });
    if(temHorario) {
      txt += `\nHorário de Trabalho:\n${horariosTxt}`;
    }
    
    let docsTxt = '';
    document.querySelectorAll("#adm-docs input:checked").forEach(ck => {
      docsTxt += `- ${ck.value}\n`;
    });
    if(docsTxt) {
      txt += `\nDocumentos Entregues:\n${docsTxt}`;
    }
    
    txt += addLinha('\nObservações', getV('adm-obs'));
    
  } else if(aba === "desligamento") {
    txt += `DETALHES DO DESLIGAMENTO\n`;
    txt += addLinha('Data do Aviso', getD('des-data-aviso'));
    txt += addLinha('Último Dia Trabalhado', getD('des-ultimo-dia'));
    txt += addLinha('Motivo', getV('des-motivo'));
    txt += addLinha('Apontamentos', getV('des-apontamentos'));
    txt += addLinha('Observações', getV('des-obs'));
    
  } else if(aba === "ferias") {
    txt += `SOLICITAÇÃO DE FÉRIAS\n`;
    txt += addLinha('Data de Início', getD('fer-inicio'));
    txt += addLinha('Quantidade de Dias', getV('fer-dias'));
    txt += addLinha('Data de Retorno', document.getElementById("fer-retorno").value);
    txt += addLinha('Abono Pecuniário', document.querySelector('input[name="fer-abono"]:checked').value);
    txt += addLinha('Observações', getV('fer-obs'));
    
  } else {
    txt += `OUTROS ASSUNTOS\n`;
    txt += addLinha('Detalhes da Solicitação', getV('outros-texto'));
  }

  txt += `\n--------------------------------------------------\n`;
  txt += `Solicitação gerada em: ${new Date().toLocaleString('pt-BR')}\n`;

  document.getElementById("saida-texto").value = txt;
  document.getElementById("modal-resumo").style.display = "flex";
});

document.getElementById("btn-copiar").addEventListener("click", () => {
  document.getElementById("saida-texto").select();
  document.execCommand("copy");
  alert("TEXTO COPIADO!");
});

document.getElementById("btn-fechar").addEventListener("click", () => {
  document.getElementById("modal-resumo").style.display = "none";
});

document.getElementById("btn-limpar").addEventListener("click", () => {
  if(confirm("LIMPAR TODOS OS DADOS?")) location.reload();
});
</script>
</body>
