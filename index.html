<style>
:root{
  --primary:#8a6a1f; --primary-dark:#5c4713; --secondary:#c9a227; --on-primary:#ffffff;
  --brand-grey:#4d4d4d; --brand-grey-dark:#2e2e2e;
  --surface:#ffffff; --surface-container-low:#f5f3ee; --surface-container:#efece4;
  --surface-container-high:#e7e2d6; --outline:#79746a; --outline-variant:#d3cdbd;
  --on-surface:#242220; --on-surface-variant:#524d43; --error:#ba1a1a; --on-error:#ffffff;
  --error-container:#ffdad6; --on-error-container:#93000a; --success:#0f7b3c; --success-bg:#e3f6ea;
}
*{ box-sizing:border-box; margin:0; padding:0; text-transform: uppercase; }
body{
  background-color:var(--surface-container-low);
  font-family:'Libre Franklin', 'Segoe UI', Arial, sans-serif;
  color:var(--on-surface); font-size:13px; padding-bottom:40px;
}
button, input, select, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
label{ display:block; margin-bottom:3px; font-size:11px; font-weight:700; color:var(--on-surface-variant); }

.app-header{
  position:sticky; top:0; z-index:50; height:44px; padding:0 14px;
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(180deg, var(--brand-grey) 0%, var(--brand-grey-dark) 100%);
  border-bottom:2px solid var(--secondary); box-shadow: inset 0 1px 0 rgba(255,255,255,0.15); color:#fff;
}
.app-header .brand{ display:flex; align-items:center; gap:9px; font-weight:700; font-size:13px; }
.app-header .brand img{ height:30px; width:auto; }
.app-header .brand span{ color:var(--secondary); letter-spacing:.2px; }

.tabs-bar{
  position:sticky; top:44px; z-index:49; display:flex; gap:2px; background:var(--surface-container-high);
  border-bottom:1px solid var(--outline-variant); padding:0 14px; overflow-x:auto;
}
.tab-btn{
  height:40px; padding:0 18px; border:none; background:transparent; cursor:pointer;
  font-size:12px; font-weight:700; color:var(--on-surface-variant); white-space:nowrap;
  border-bottom:3px solid transparent;
}
.tab-btn.ativo{ color:var(--primary); border-bottom-color:var(--primary); background:var(--surface); }

.main-container{ width:850px; max-width:100%; margin:0 auto; padding:15px; }

.group-box{
  background:var(--surface); border:1px solid var(--outline-variant); border-radius:5px;
  margin-top:16px; box-shadow:0 1px 2px rgba(0,0,0,0.05); overflow:hidden;
}
.group-box-bar{
  height:32px; padding:0 14px; display:flex; align-items:center;
  background:linear-gradient(180deg, var(--secondary) 0%, var(--primary) 100%); color:#fff;
  font-size:12px; font-weight:700;
}
.group-box-body{ padding:15px; }

.grid{ display:grid; gap:12px 15px; grid-template-columns:repeat(12, 1fr); }
.c-2{ grid-column:span 2; } .c-3{ grid-column:span 3; } .c-4{ grid-column:span 4; } .c-5{ grid-column:span 5; } .c-6{ grid-column:span 6; } .c-7{ grid-column:span 7; } .c-10{ grid-column:span 10; } .c-12{ grid-column:span 12; }
.stack{ display:flex; flex-direction:column; gap:2px; }

.input-standard{
  height:34px; border:1px solid var(--outline-variant); padding:0 10px;
  border-radius:4px; width:100%; background:#fff;
}
.input-standard:focus{ outline:none; border-color:var(--primary); box-shadow:0 0 0 2px rgba(138,106,31,0.2); }
textarea.input-standard{ height:auto; min-height:70px; padding:8px 10px; resize:vertical; }

.horario-tabela { width: 100%; border-collapse: collapse; margin-top: 5px; }
.horario-tabela th, .horario-tabela td { border: 1px solid var(--outline-variant); padding: 6px; text-align: center; }
.horario-tabela th { background: var(--surface-container); font-size: 10px; }

.checklist { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.check-item { display: flex; align-items: center; gap: 8px; font-size: 11px; padding: 6px; border: 1px solid var(--outline-variant); border-radius: 4px; cursor: pointer; }
.check-item input { width: 16px; height: 16px; accent-color: var(--primary); }

.radio-row{ display:flex; align-items:center; gap:20px; margin-top:5px; }
.radio-item{ display:flex; align-items:center; gap:6px; font-size:12px; cursor:pointer; }

.action-bar{
  margin-top:20px; padding-top:15px; border-top:1px solid var(--outline-variant);
  display:flex; justify-content:space-between;
}
.btn{
  height:38px; padding:0 20px; border-radius:4px; font-size:12px; font-weight:700;
  cursor:pointer; border:1px solid var(--outline-variant); background:#f5f5f5; color:var(--primary);
}
.btn-primary{ background:var(--primary); color:#fff; border-color:var(--primary-dark); }

.status-bar{
  position:fixed; bottom:0; left:0; width:100%; height:26px;
  background:var(--surface-container-high); border-top:1px solid var(--outline-variant);
  display:flex; align-items:center; justify-content:space-between; padding:0 14px; font-size:10px;
}

.modal-fundo{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:100; align-items:center; justify-content:center; }
.modal-frame{ background:#fff; width:600px; max-width:95%; max-height:90vh; border-radius:6px; display:flex; flex-direction:column; overflow:hidden; }
.modal-body{ padding:15px; overflow-y:auto; }
#saida-texto{ width:100%; min-height:300px; font-family:monospace; padding:10px; border:1px solid var(--outline-variant); text-transform: none; }

.oculto{ display:none !important; }

@media (max-width:768px){
  .grid > div { grid-column: span 12; }
  .checklist { grid-template-columns: 1fr; }
}
</style>
</head>

<script>
"use strict";
document.getElementById("stbar-data").textContent = new Date().toLocaleDateString('pt-BR');

// MÁSCARAS
function mask(id, fn) {
  const el = document.getElementById(id);
  el.addEventListener("input", (e) => { e.target.value = fn(e.target.value); });
}
mask("cnpj", v => v.replace(/\D/g,"").slice(0,14).replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2})/, "$1.$2.$3/$4-$5"));
mask("cpf", v => v.replace(/\D/g,"").slice(0,11).replace(/^(\d{3})(\d{3})(\d{3})(\d{0,2})/, "$1.$2.$3-$4"));

// NAVEGAÇÃO
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("ativo"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.add("oculto"));
    btn.classList.add("ativo");
    document.querySelector(`[data-panel="${btn.dataset.tab}"]`).classList.remove("oculto");
  });
});

// CÁLCULO DE FÉRIAS
function calcFerias() {
  const ini = document.getElementById("fer-inicio").value;
  const dias = parseInt(document.getElementById("fer-dias").value) || 0;
  if(ini && dias) {
    const d = new Date(ini + "T00:00:00");
    d.setDate(d.getDate() + dias);
    document.getElementById("fer-retorno").value = d.toLocaleDateString('pt-BR');
  }
}
document.getElementById("fer-inicio").addEventListener("change", calcFerias);
document.getElementById("fer-dias").addEventListener("input", calcFerias);

// GERAR RESUMO MARKDOWN
document.getElementById("btn-enviar").addEventListener("click", () => {
  const getV = id => document.getElementById(id).value.toUpperCase();
  const getD = id => { const v = document.getElementById(id).value; if(!v) return ""; const [a,m,d] = v.split("-"); return `${d}/${m}/${a}`; };
  
  let m = `### 📄 SOLICITAÇÃO DE DEPARTAMENTO PESSOAL - R7\n\n`;
  m += `#### 🏢 IDENTIFICAÇÃO\n`;
  m += `- **EMPRESA:** ${getV('razao')}\n`;
  m += `- **CNPJ:** ${getV('cnpj')}\n`;
  m += `- **UNIDADE:** ${getV('unidade')}\n`;
  m += `- **FUNCIONÁRIO:** ${getV('nome')} (MATRÍCULA: ${getV('matricula')})\n`;
  m += `- **CPF:** ${getV('cpf')}\n`;
  m += `- **DATA ADMISSÃO:** ${getD('data-adm')}\n\n`;
  
  const aba = document.querySelector(".tab-btn.ativo").dataset.tab;
  m += `#### 📂 TIPO: ${aba.toUpperCase()}\n`;
  
  if(aba === "admissao") {
    m += `- **CARGO:** ${getV('adm-cargo')}\n`;
    m += `- **PRAZO EXPERIÊNCIA:** ${getV('adm-prazo')} DIAS\n`;
    m += `\n**🕒 HORÁRIO DE TRABALHO:**\n`;
    document.querySelectorAll(".h-row").forEach(row => {
      const dia = row.dataset.dia;
      const ent = row.querySelector(".h-ent").value;
      const sai = row.querySelector(".h-sai").value;
      const int = row.querySelector(".h-int").value.toUpperCase();
      if(ent || sai) m += `- ${dia}: ${ent} ÀS ${sai} (INTERVALO: ${int})\n`;
    });
    m += `\n**📋 DOCUMENTOS ENTREGUES:**\n`;
    document.querySelectorAll("#adm-docs input:checked").forEach(ck => {
      m += `- [x] ${ck.value}\n`;
    });
    m += `\n- **OBSERVAÇÕES:** ${getV('adm-obs')}\n`;
  } else if(aba === "desligamento") {
    m += `- **DATA DO AVISO:** ${getD('des-data-aviso')}\n`;
    m += `- **ÚLTIMO DIA TRABALHADO:** ${getD('des-ultimo-dia')}\n`;
    m += `- **MOTIVO:** ${getV('des-motivo')}\n`;
    m += `- **APONTAMENTOS:** ${getV('des-apontamentos')}\n`;
    m += `- **OBSERVAÇÕES:** ${getV('des-obs')}\n`;
  } else if(aba === "ferias") {
    m += `- **DATA INÍCIO:** ${getD('fer-inicio')}\n`;
    m += `- **DIAS:** ${getV('fer-dias')}\n`;
    m += `- **DATA RETORNO:** ${document.getElementById("fer-retorno").value}\n`;
    m += `- **ABONO PECUNIÁRIO:** ${document.querySelector('input[name="fer-abono"]:checked').value}\n`;
    m += `- **OBSERVAÇÕES:** ${getV('fer-obs')}\n`;
  } else {
    m += `- **DETALHES:** ${getV('outros-texto')}\n`;
  }

  document.getElementById("saida-texto").value = m;
  document.getElementById("modal-resumo").style.display = "flex";
});

document.getElementById("btn-copiar").addEventListener("click", () => {
  document.getElementById("saida-texto").select();
  document.execCommand("copy");
  alert("MARKDOWN COPIADO!");
});

document.getElementById("btn-fechar").addEventListener("click", () => {
  document.getElementById("modal-resumo").style.display = "none";
});

document.getElementById("btn-limpar").addEventListener("click", () => {
  if(confirm("LIMPAR TODOS OS DADOS?")) location.reload();
});
</script>
</body>
</html>
